<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kraken Display</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;700&display=swap">
<style>
  :root {
    --cpu: #38bdf8;
    --gpu: #a78bfa;
    --ram: #34d399;
    --track: rgba(255,255,255,0.08);
    --text: #f1f5f9;
    --muted: #8391a7;
    --font: Oxanium, Bahnschrift, "Segoe UI", system-ui, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
  body {
    font-family: var(--font);
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  #screen { width: 100vw; height: 100vh; display: block; }
  body.preview {
    display: flex; align-items: center; justify-content: center;
    background: #111418;
  }
  body.preview #screen {
    width: min(640px, 90vw, 90vh); height: min(640px, 90vw, 90vh);
    border-radius: 50%;
    box-shadow: 0 0 0 14px #1d2127, 0 0 0 16px #2a2f37, 0 20px 60px rgba(0,0,0,.6);
  }
  text { font-family: var(--font); }
  .arc { fill: none; stroke-linecap: round; transition: stroke-dasharray .9s ease; }
  .track { fill: none; stroke: var(--track); stroke-linecap: round; }
  .label { font-size: 38px; font-weight: 700; letter-spacing: .14em; text-anchor: middle; }
  .temp { font-size: 150px; font-weight: 700; text-anchor: middle; fill: var(--text); transition: fill .9s ease; }
  .deg { font-size: 46px; font-weight: 500; }
  .value { font-size: 58px; font-weight: 700; text-anchor: middle; fill: var(--text); transition: fill .9s ease; }
  .sub { font-size: 22px; font-weight: 600; letter-spacing: .18em; text-anchor: middle; fill: var(--muted); }
  #ramBar { transition: width .9s ease; }
</style>
</head>
<body>
<svg id="screen" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#0f1724"/>
      <stop offset="100%" stop-color="#000"/>
    </radialGradient>
  </defs>
  <rect width="640" height="640" fill="url(#bg)"/>

  <path id="cpuTrack" class="track" stroke-width="26"/>
  <path id="gpuTrack" class="track" stroke-width="26"/>
  <path id="cpuArc" class="arc" stroke="var(--cpu)" stroke-width="26" pathLength="100" stroke-dasharray="0 100"/>
  <path id="gpuArc" class="arc" stroke="var(--gpu)" stroke-width="26" pathLength="100" stroke-dasharray="0 100"/>

  <path d="M 252 80 C 252 80 242 93 242 100 A 10 10 0 0 0 262 100 C 262 93 252 80 252 80 Z" fill="var(--muted)"/>
  <text x="330" y="104" class="sub">LÍQUIDO</text>
  <text x="320" y="164" class="value" id="liqTemp">--°</text>

  <line x1="320" y1="200" x2="320" y2="440" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <text x="200" y="226" class="label" fill="var(--cpu)">CPU</text>
  <text x="200" y="348" class="temp" id="cpuTemp">--<tspan class="deg" dy="-68">°</tspan></text>
  <text x="200" y="414" class="value" id="cpuLoad">--%</text>
  <text x="200" y="442" class="sub">USO</text>

  <text x="440" y="226" class="label" fill="var(--gpu)">GPU</text>
  <text x="440" y="348" class="temp" id="gpuTemp">--<tspan class="deg" dy="-68">°</tspan></text>
  <text x="440" y="414" class="value" id="gpuLoad">--%</text>
  <text x="440" y="442" class="sub">USO</text>

  <text x="178" y="500" class="label" fill="var(--ram)" style="text-anchor:start">RAM</text>
  <text x="462" y="500" class="value" id="ramTxt" style="font-size:28px;font-weight:500;text-anchor:end">-- / -- GB</text>
  <rect x="178" y="514" width="284" height="24" rx="12" fill="var(--track)"/>
  <rect x="178" y="514" width="0" height="24" rx="12" fill="var(--ram)" id="ramBar"/>
  <text x="320" y="582" class="value" id="ramPct" style="font-size:48px">--%</text>
</svg>

<script>
(() => {
  const ALERT = {
    cpu: [80, 90],
    gpu: [80, 88],
    liquid: [38, 42],
  };
  const ORANGE = "#fb923c", RED = "#ef4444";

  const C = 320, R = 290;
  const SPAN = { cpu: [200, 340], gpu: [160, 20] };

  const $ = id => document.getElementById(id);
  const ok = v => typeof v === "number" && isFinite(v);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const alertColor = (t, [warn, crit]) => t >= crit ? RED : t >= warn ? ORANGE : "";

  const point = deg => {
    const a = (deg - 90) * Math.PI / 180;
    return [C + R * Math.cos(a), C + R * Math.sin(a)].map(n => n.toFixed(2));
  };
  const arcPath = (a0, a1) => {
    const [x0, y0] = point(a0), [x1, y1] = point(a1);
    return `M ${x0} ${y0} A ${R} ${R} 0 0 ${a1 > a0 ? 1 : 0} ${x1} ${y1}`;
  };

  for (const k of ["cpu", "gpu"]) {
    const d = arcPath(...SPAN[k]);
    $(k + "Track").setAttribute("d", d);
    $(k + "Arc").setAttribute("d", d);
  }

  const fill = (k, f) => $(k + "Arc").setAttribute("stroke-dasharray", `${(clamp(f, 0, 1) * 100).toFixed(1)} 100`);

  function setTemp(k, t) {
    const el = $(k + "Temp");
    el.firstChild.nodeValue = ok(t) ? Math.round(t) : "--";
    el.style.fill = ok(t) ? alertColor(t, ALERT[k]) : "";
  }

  function setLoad(k, l) {
    $(k + "Load").textContent = ok(l) ? Math.round(clamp(l, 0, 1) * 100) + "%" : "--%";
    fill(k, ok(l) ? l : 0);
  }

  function setRam(ram) {
    if (!ram || !ok(ram.inUse) || !(ram.totalSize > 0)) return;
    const f = clamp(ram.inUse / ram.totalSize, 0, 1);
    $("ramPct").textContent = Math.round(f * 100) + "%";
    $("ramTxt").textContent = `${(ram.inUse / 1024).toFixed(1)} / ${Math.round(ram.totalSize / 1024)} GB`;
    $("ramBar").setAttribute("width", (284 * f).toFixed(1));
  }

  function setLiquid(t) {
    const el = $("liqTemp");
    el.textContent = ok(t) ? t.toFixed(1) + "°" : "--°";
    el.style.fill = ok(t) ? alertColor(t, ALERT.liquid) : "";
  }

  function pickGpu(gpus = []) {
    return gpus.find(g => /nvidia|geforce|rtx|gtx|radeon rx|arc [ab]/i.test(g.name || "") && ok(g.temperature))
        || gpus.find(g => ok(g.temperature))
        || gpus[0] || {};
  }

  function render(data) {
    const cpu = (data.cpus || [])[0] || {};
    const gpu = pickGpu(data.gpus);
    setTemp("cpu", cpu.temperature);
    setLoad("cpu", cpu.load);
    setTemp("gpu", gpu.temperature);
    setLoad("gpu", gpu.load);
    setRam(data.ram);
    setLiquid(data.kraken && data.kraken.liquidTemperature);
  }

  let live = false;
  window.nzxt = window.nzxt || {};
  window.nzxt.v1 = Object.assign(window.nzxt.v1 || {}, {
    onMonitoringDataUpdate: data => { live = true; render(data); },
  });

  if (new URLSearchParams(location.search).get("kraken") !== "1") {
    document.body.classList.add("preview");
  }

  setTimeout(() => {
    if (live) return;
    const s = { ct: 48, cl: .22, gt: 55, gl: .35, ram: 14500, liq: 31 };
    const walk = (v, step, lo, hi) => clamp(v + (Math.random() - .5) * step, lo, hi);
    const tick = () => {
      if (live) return;
      s.cl = walk(s.cl, .25, .03, 1);
      s.gl = walk(s.gl, .3, .02, 1);
      s.ct = walk(s.ct + (s.cl * 45 + 38 - s.ct) * .15, 3, 32, 95);
      s.gt = walk(s.gt + (s.gl * 40 + 40 - s.gt) * .15, 3, 32, 90);
      s.ram = walk(s.ram, 900, 8000, 30000);
      s.liq = walk(s.liq + (28 + s.cl * 10 - s.liq) * .05, .3, 25, 45);
      render({
        cpus: [{ temperature: s.ct, load: s.cl }],
        gpus: [{ name: "GeForce", temperature: s.gt, load: s.gl }],
        ram: { inUse: s.ram, totalSize: 32768 },
        kraken: { liquidTemperature: s.liq },
      });
    };
    tick();
    setInterval(tick, 1000);
  }, 1500);
})();
</script>
</body>
</html>
